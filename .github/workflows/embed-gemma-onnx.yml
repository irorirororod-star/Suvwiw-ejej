name: Embed with EmbeddingGemma-300M ONNX (Max Quality + Speed)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file (.jsonl, .md, .txt, README.md, etc.)'
        required: true
        default: 'data/README.md'
      batch_size:
        description: 'Batch size (64 recommended for GitHub runners)'
        required: false
        default: '64'
      prefix:
        description: 'Task prefix (strongly recommended for best quality)'
        required: false
        default: 'task: search result | query: '

  push:
    paths:
      - 'data/**'

jobs:
  embed:
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache Hugging Face Hub (model + tokenizer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-embeddinggemma-onnx-${{ hashFiles('embed.py', 'requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run embedding pipeline (Hardened)
        run: |
          python embed.py \
            --input "${{ inputs.input_file || 'data/README.md' }}" \
            --output embeddings.parquet \
            --batch-size ${{ inputs.batch_size || 64 }} \
            --prefix "${{ inputs.prefix }}"

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-embeddings
          path: embeddings.parquet
          retention-days: 30
