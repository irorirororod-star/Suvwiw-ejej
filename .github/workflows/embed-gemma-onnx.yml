name: Embed with EmbeddingGemma-300M ONNX (Q8_0 + Smart Chunking)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file (.jsonl, .md, .txt, README.md, etc.)'
        required: true
        default: 'data/README.md'
      batch_size:
        description: 'Batch size (64 recommended for GH runners)'
        required: false
        default: '64'
      quantization:
        description: 'q8 = nearly identical quality + max speed | q4 = fastest | fp32 = absolute max quality'
        required: false
        default: 'q8'
      prefix:
        description: 'Task prefix (strongly recommended)'
        required: false
        default: 'task: search result | query: '

  push:
    paths:
      - 'data/**'

jobs:
  embed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Hugging Face Hub (model + tokenizer)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-embeddinggemma-onnx-q8-${{ hashFiles('embed.py') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install transformers onnxruntime tqdm pandas pyarrow huggingface_hub

      - name: Run embedding pipeline (Q8_0 default – max quality + speed)
        run: |
          python embed.py \
            --input "${{ inputs.input_file || 'data/README.md' }}" \
            --output embeddings.parquet \
            --batch-size ${{ inputs.batch_size || 64 }} \
            --quantization ${{ inputs.quantization || 'q8' }} \
            --prefix "${{ inputs.prefix }}"

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-embeddings-q8
          path: embeddings.parquet
          retention-days: 30
