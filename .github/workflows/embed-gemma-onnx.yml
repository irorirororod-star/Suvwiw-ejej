name: Embed with EmbeddingGemma-300M ONNX (Smart Chunking)

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: 'Path to input file (.jsonl, .md, .txt, etc.)'
        required: true
        default: 'data/README.md'
      batch_size:
        description: 'Batch size for embedding'
        required: false
        default: '64'
      prefix:
        description: 'Task prefix (recommended)'
        required: false
        default: 'task: search result | query: '

  push:
    paths:
      - 'data/**'

jobs:
  embed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Hugging Face Hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-embeddinggemma-onnx-${{ hashFiles('embed.py') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install transformers onnxruntime tqdm pandas pyarrow huggingface_hub

      - name: Run embedding pipeline (max quality + speed with smart chunking)
        run: |
          python embed.py \
            --input "${{ inputs.input_file || 'data/README.md' }}" \
            --output embeddings.parquet \
            --batch-size ${{ inputs.batch_size || 64 }} \
            --prefix "${{ inputs.prefix }}"

      - name: Upload embeddings artifact
        uses: actions/upload-artifact@v4
        with:
          name: gemma-embeddings
          path: embeddings.parquet
          retention-days: 30
